<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Lite | Sales & Pipeline Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <div id="storageBanner" class="alert alert-warning alert-dismissible fade show rounded-0 mb-0 d-none" role="status" aria-live="polite">
    <div class="container d-flex align-items-center justify-content-between">
      <span id="storageBannerText"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#dashboard" data-nav="dashboard">CRM Lite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#dashboard" data-nav="dashboard">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#leads" data-nav="leads">Leads</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#pipeline" data-nav="pipeline">Pipeline</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tests.html">Tests</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 flex-wrap">
          <span id="currentRoleBadge" class="badge bg-info text-dark">Role</span>
          <label for="userSwitcher" class="visually-hidden">Switch active user</label>
          <select id="userSwitcher" class="form-select form-select-sm w-auto" aria-label="Switch active user"></select>
          <button id="btnResetData" type="button" class="btn btn-outline-warning btn-sm d-none">Reset Data</button>
        </div>
      </div>
    </div>
  </nav>

 
  <main class="container my-4 flex-grow-1">
    <section id="view-dashboard" class="crm-view"></section>
    <section id="view-leads" class="crm-view d-none"></section>
    <section id="view-pipeline" class="crm-view d-none"></section>
  </main>


  <footer class="bg-white border-top py-3 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-muted small">
      <span>CRM Lite &mdash; Polaris OJT Frontend Project</span>
      <span>Sample data &mdash; runs in your browser; role checks are a demonstration only.</span>
    </div>
  </footer>

 
  <div class="modal fade" id="leadModal" tabindex="-1" aria-labelledby="leadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <form id="leadForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="leadModalLabel">Add Lead</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="leadId" />
            <div class="mb-3">
              <label for="leadName" class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="leadName" required aria-describedby="err-leadName" />
              <div id="err-leadName" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="leadCompany" class="form-label">Company</label>
              <input type="text" class="form-control" id="leadCompany" aria-describedby="err-leadCompany" />
              <div id="err-leadCompany" class="invalid-feedback"></div>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label for="leadEmail" class="form-label">Email <span class="text-muted small">(email or phone required)</span></label>
                <input type="email" class="form-control" id="leadEmail" aria-describedby="err-leadEmail" />
                <div id="err-leadEmail" class="invalid-feedback"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="leadPhone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="leadPhone" aria-describedby="err-leadPhone" />
                <div id="err-leadPhone" class="invalid-feedback"></div>
              </div>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label for="leadSource" class="form-label">Source</label>
                <select class="form-select" id="leadSource">
                  <option value="Website">Website</option>
                  <option value="Referral">Referral</option>
                  <option value="Event">Event</option>
                  <option value="Cold call">Cold call</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="leadStatus" class="form-label">Status</label>
                <select class="form-select" id="leadStatus">
                  <option value="New">New</option>
                  <option value="Contacted">Contacted</option>
                  <option value="Qualified">Qualified</option>
                  <option value="Unqualified">Unqualified</option>
                </select>
              </div>
            </div>
            <div class="mb-3 d-none" id="leadOwnerGroup">
              <label for="leadOwner" class="form-label">Owner (Account Manager only)</label>
              <select class="form-select" id="leadOwner"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btnSaveLead">Save Lead</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <div class="modal fade" id="convertModal" tabindex="-1" aria-labelledby="convertModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="convertForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="convertModalLabel">Convert Lead to Deal</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="convertLeadId" />
            <p class="small text-muted" id="convertLeadSummary"></p>
            <div class="mb-3">
              <label for="convertTitle" class="form-label">Deal Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="convertTitle" required aria-describedby="err-convertTitle" />
              <div id="err-convertTitle" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="convertValue" class="form-label">Deal Value (INR) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="convertValue" min="1" max="1000000000" required aria-describedby="err-convertValue" />
              <div id="err-convertValue" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="convertCloseDate" class="form-label">Expected Close Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="convertCloseDate" required aria-describedby="err-convertCloseDate" />
              <div id="err-convertCloseDate" class="invalid-feedback"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Create Deal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="dealModal" tabindex="-1" aria-labelledby="dealModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <form id="dealForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="dealModalLabel">Deal Details</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="dealId" />
            <div id="dealReadonlyNotice" class="alert alert-secondary py-2 small d-none">
              This deal is read-only.
            </div>
            <div class="mb-3">
              <label for="dealTitle" class="form-label">Deal Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="dealTitle" aria-describedby="err-dealTitle" />
              <div id="err-dealTitle" class="invalid-feedback"></div>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label for="dealCompany" class="form-label">Company</label>
                <input type="text" class="form-control" id="dealCompany" />
              </div>
              <div class="col-md-6 mb-3">
                <label for="dealContact" class="form-label">Contact Name</label>
                <input type="text" class="form-control" id="dealContact" />
              </div>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label for="dealValue" class="form-label">Value (INR) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="dealValue" aria-describedby="err-dealValue" />
                <div id="err-dealValue" class="invalid-feedback"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="dealCloseDate" class="form-label">Expected Close <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dealCloseDate" aria-describedby="err-dealCloseDate" />
                <div id="err-dealCloseDate" class="invalid-feedback"></div>
              </div>
            </div>
            <div class="mb-3">
              <label for="dealStage" class="form-label">Stage</label>
              <select class="form-select" id="dealStage">
                <option value="Prospecting">Prospecting</option>
                <option value="Proposal">Proposal</option>
                <option value="Negotiation">Negotiation</option>
                <option value="Won">Won</option>
                <option value="Lost">Lost</option>
              </select>
            </div>
            <div class="mb-3" id="lostReasonGroup">
              <label for="dealLostReason" class="form-label">Lost Reason <span class="text-muted small">(Required if stage is Lost, min 3 chars)</span></label>
              <textarea class="form-control" id="dealLostReason" rows="2" aria-describedby="err-dealLostReason"></textarea>
              <div id="err-dealLostReason" class="invalid-feedback"></div>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <div>
              <button type="button" class="btn btn-outline-danger d-none" id="btnDeleteDeal">Delete Deal</button>
              <button type="button" class="btn btn-outline-warning d-none" id="btnReopenDeal">Reopen Deal</button>
            </div>
            <div>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary" id="btnSaveDeal">Save Changes</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>


  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h6" id="confirmModalLabel">Confirm Action</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirmModalBody">Are you sure?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" id="btnConfirmCancel" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger btn-sm" id="btnConfirmProceed">Confirm</button>
        </div>
      </div>
    </div>
  </div>


  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="appToastBody">Action completed.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/permissions.js" defer></script>
  <script src="js/validators.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/views/dashboardView.js" defer></script>
  <script src="js/views/leadsView.js" defer></script>
  <script src="js/views/pipelineView.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
